name: Availability ablation checks
on:
  pull_request:
    paths:
      - 'engine/ablation.py'
      - 'tests/test_ablation.py'
      - 'docs/ABLATION_PROTOCOL.md'
      - 'ablation-lab/**'
      - 'evidence/sources.json'
  push:
    branches: [main, 'arena/**']
    paths:
      - 'engine/ablation.py'
      - 'tests/test_ablation.py'
      - 'docs/ABLATION_PROTOCOL.md'
      - 'ablation-lab/**'
      - 'evidence/sources.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: availability-ablation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser-test tools
        run: npm ci --ignore-scripts
      - name: Validate the ablation contract and source-linked page
        run: |
          python3 -m unittest tests.test_ablation -v
          python3 ablation-lab/verify.py
      - name: Test responsive accessibility
        run: node ablation-lab/browser_test.cjs
