name: Research quality
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  static-and-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser-test tools
        run: npm ci --ignore-scripts
      - name: Validate the availability and decision registers
        run: |
          python engine/availability.py
          python engine/registers.py
      - name: Check committed generated pages and references
        run: python tools/verify.py
      - name: Test arithmetic and site integrity
        run: python -m unittest discover -s tests -v
      - name: Test inherited release checker fixtures
        run: python -m unittest discover -s release-checks -p 'test_*.py' -v
      - name: Confirm deterministic regeneration
        run: |
          python tools/build.py
          git diff --exit-code -- '*.html'
      - name: Verify official-source section (session-00cf851d)
        run: |
          python session-00cf851d/tools/analysis.py
          python session-00cf851d/tools/results_audit.py
          python session-00cf851d/tools/build.py
          python session-00cf851d/tools/check.py
          git diff --exit-code -- 'session-00cf851d/*.html'
          python -m unittest discover -s session-00cf851d/tests
      - name: Browser-test session-00cf851d
        run: node session-00cf851d/tools/browser_test.cjs
